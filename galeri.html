<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri — Boibanet</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/js/include.js" defer></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .masonry { columns: 1; column-gap: 1rem; }
    @media (min-width: 640px) { .masonry { columns: 2; } }
    @media (min-width: 1024px) { .masonry { columns: 3; } }
    .masonry-item { break-inside: avoid; margin-bottom: 1rem; }
    .gallery-card:hover .card-overlay { opacity: 1; }
    .card-overlay { opacity: 0; transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <div include="/assets/components/header.html"></div>

  <!-- HEADER HALAMAN -->
  <section class="bg-gradient-to-br from-primary to-secondary text-white py-12 px-4">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold mb-2">Galeri</h1>
      <p class="text-blue-100">Dokumentasi kegiatan & momen</p>
    </div>
  </section>

  <!-- FILTER KATEGORI -->
  <section class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex gap-2 flex-wrap">
      <button onclick="filterKategori(null)"
        class="filter-btn text-sm px-4 py-1.5 rounded-full border bg-primary border-primary text-white transition"
        data-kat="semua">Semua</button>
      <button onclick="filterKategori('Kegiatan')"
        class="filter-btn text-sm px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition"
        data-kat="Kegiatan">Kegiatan</button>
      <button onclick="filterKategori('Kampus')"
        class="filter-btn text-sm px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition"
        data-kat="Kampus">Kampus</button>
      <button onclick="filterKategori('Penelitian')"
        class="filter-btn text-sm px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition"
        data-kat="Penelitian">Penelitian</button>
      <button onclick="filterKategori('Umum')"
        class="filter-btn text-sm px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition"
        data-kat="Umum">Umum</button>
    </div>
  </section>

  <!-- GALERI GRID -->
  <section class="max-w-6xl mx-auto px-4 pb-16 flex-1">

    <!-- Skeleton -->
    <div id="galeri-skeleton" class="masonry">
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-48"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-64"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-56"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-72"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-48"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-60"></div>
    </div>

    <!-- Grid -->
    <div id="galeri-grid" class="masonry hidden"></div>

    <!-- Empty -->
    <div id="galeri-empty" class="hidden text-center py-16 text-gray-400 text-sm">
      Belum ada foto.
    </div>

  </section>

  <!-- LIGHTBOX MODAL -->
  <div id="modal-galeri"
    class="hidden fixed inset-0 bg-black/85 z-[9999] flex items-center justify-center px-4"
    onclick="closeModal()">
    <div class="relative max-w-2xl w-full" onclick="event.stopPropagation()">

      <button onclick="closeModal()"
        class="absolute -top-12 right-0 text-white/70 hover:text-white transition">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <img id="modal-img" src="" alt=""
        class="w-full rounded-2xl object-contain max-h-[75vh] bg-black shadow-2xl">

      <div class="mt-4">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p id="modal-judul" class="text-white font-semibold text-base"></p>
            <p id="modal-deskripsi" class="text-gray-300 text-sm mt-1"></p>
          </div>
          <span id="modal-kategori" class="flex-shrink-0 text-xs px-2 py-1 rounded bg-white/10 text-white"></span>
        </div>
        <p id="modal-tanggal" class="text-gray-400 text-xs mt-2"></p>
      </div>

    </div>
  </div>

  <div include="/assets/components/footer.html"></div>

  <script type="module">
    import GalleryController from "/assets/js/controllers/GalleryController.js";

    async function loadFoto(kategori = null) {
      const skeleton = document.getElementById('galeri-skeleton');
      const grid     = document.getElementById('galeri-grid');
      const empty    = document.getElementById('galeri-empty');

      const data = await GalleryController.getFoto(kategori);

      skeleton.classList.add('hidden');

      if (data.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = data.map((item, i) => `
        <div class="masonry-item gallery-card relative rounded-xl overflow-hidden shadow-sm cursor-pointer"
          onclick="openModal(${i}, ${JSON.stringify(data).replace(/"/g, '&quot;')})">
          <img src="${item.img_url}" alt="${item.judul}"
            class="w-full object-cover block"
            onerror="this.parentElement.style.display='none'">
          <div class="card-overlay absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex flex-col justify-end p-4">
            <p class="text-white font-semibold text-sm line-clamp-1">${item.judul}</p>
            <div class="flex items-center justify-between mt-1">
              <span class="text-xs ${GalleryController.badgeKategori(item.kategori)} px-2 py-0.5 rounded">
                ${item.kategori}
              </span>
              <span class="text-xs text-gray-300">${item.tanggalFormatted}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.openModal = (index, data) => {
      const item = data[index];
      document.getElementById('modal-img').src            = item.img_url;
      document.getElementById('modal-judul').textContent  = item.judul;
      document.getElementById('modal-deskripsi').textContent = item.deskripsi || '';
      document.getElementById('modal-kategori').textContent  = item.kategori;
      document.getElementById('modal-tanggal').textContent   = item.tanggalFormatted;
      document.getElementById('modal-galeri').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    };

    window.closeModal = () => {
      document.getElementById('modal-galeri').classList.add('hidden');
      document.body.style.overflow = '';
    };

    window.filterKategori = (kat) => {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-white', 'border-primary');
        btn.classList.add('border-gray-300', 'text-gray-600');
      });
      const active = document.querySelector(`[data-kat="${kat || 'semua'}"]`);
      if (active) {
        active.classList.add('bg-primary', 'text-white', 'border-primary');
        active.classList.remove('border-gray-300', 'text-gray-600');
      }
      loadFoto(kat);
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    loadFoto();
  </script>

</body>
</html>
