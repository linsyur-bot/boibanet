<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri — Boibanet</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/js/include.js" defer></script>
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* Masonry grid */
    .masonry {
      columns: 1;
      column-gap: 1rem;
    }
    @media (min-width: 640px) { .masonry { columns: 2; } }
    @media (min-width: 1024px) { .masonry { columns: 3; } }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
    }

    /* Lightbox */
    #lightbox {
      backdrop-filter: blur(8px);
    }

    /* Hover overlay */
    .gallery-card:hover .card-overlay {
      opacity: 1;
    }
    .card-overlay {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.5s ease forwards; }
  </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <div include="/assets/components/header.html"></div>

  <!-- ================================================ -->
  <!-- HEADER HALAMAN -->
  <!-- ================================================ -->
  <section class="bg-gradient-to-br from-primary to-secondary text-white py-14 px-4 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-4 left-10 w-32 h-32 rounded-full bg-white"></div>
      <div class="absolute bottom-4 right-20 w-20 h-20 rounded-full bg-white"></div>
      <div class="absolute top-10 right-40 w-12 h-12 rounded-full bg-white"></div>
    </div>
    <div class="max-w-6xl mx-auto relative z-10">
      <div class="flex items-center gap-2 text-blue-200 text-sm mb-3">
        <a href="/" class="hover:text-white transition">Home</a>
        <span>›</span>
        <span class="text-white">Galeri</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold mb-2">Galeri</h1>
      <p class="text-blue-100 text-sm md:text-base">
        Dokumentasi kegiatan & momen dari Instagram
      </p>
    </div>
  </section>

  <!-- ================================================ -->
  <!-- FILTER & SEARCH -->
  <!-- ================================================ -->
  <section class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between">

      <!-- Filter Kategori -->
      <div id="filter-wrap" class="flex gap-2 flex-wrap">
        <button onclick="filterGaleri(null)"
          class="filter-btn text-sm px-4 py-1.5 rounded-full border bg-primary border-primary text-white transition"
          data-kat="semua">Semua</button>
      </div>

      <!-- Counter -->
      <p id="counter" class="text-xs text-gray-400"></p>

    </div>
  </section>

  <!-- ================================================ -->
  <!-- GALERI MASONRY -->
  <!-- ================================================ -->
  <section class="max-w-6xl mx-auto px-4 pb-16 flex-1">

    <!-- Skeleton -->
    <div id="galeri-skeleton" class="masonry">
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-48"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-64"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-56"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-72"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-48"></div>
      <div class="masonry-item rounded-xl bg-gray-200 animate-pulse h-60"></div>
    </div>

    <!-- Grid Galeri -->
    <div id="galeri-grid" class="masonry hidden"></div>

    <!-- Empty -->
    <div id="galeri-empty" class="hidden text-center py-20">
      <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <p class="text-gray-400 text-sm">Belum ada foto.</p>
    </div>

  </section>

  <!-- ================================================ -->
  <!-- LIGHTBOX -->
  <!-- ================================================ -->
  <div id="lightbox"
    class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-4"
    onclick="closeLightbox(event)">
    <div class="relative max-w-3xl w-full" onclick="event.stopPropagation()">

      <!-- Tombol tutup -->
      <button onclick="closeLightbox()"
        class="absolute -top-10 right-0 text-white/70 hover:text-white transition">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Gambar -->
      <img id="lb-img" src="" alt="" class="w-full rounded-xl max-h-[70vh] object-contain bg-black">

      <!-- Info -->
      <div class="mt-4 text-white">
        <div class="flex justify-between items-start gap-4">
          <div>
            <p id="lb-judul" class="font-semibold text-base"></p>
            <p id="lb-konten" class="text-gray-300 text-sm mt-1 line-clamp-3"></p>
          </div>
          <a id="lb-link" href="#" target="_blank"
            class="flex-shrink-0 flex items-center gap-1.5 text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
            Lihat di Instagram
          </a>
        </div>
        <div class="flex items-center gap-3 mt-3">
          <span id="lb-kategori" class="text-xs px-2 py-1 rounded bg-white/10 text-white"></span>
          <span id="lb-tanggal" class="text-xs text-gray-400"></span>
        </div>
      </div>

    </div>
  </div>

  <div include="/assets/components/footer.html"></div>

  <!-- ================================================ -->
  <!-- SCRIPT -->
  <!-- ================================================ -->
  <script>
    const SHEET_ID  = '1tI_6A-NLyRbyzwyzV2CNIQjTqWnz-uetCAHWTJu7ECw';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

    let semuaData = [];

    // ── FETCH DATA ──────────────────────────────────
    async function loadGaleri() {
      try {
        const res  = await fetch(SHEET_URL);
        const text = await res.text();
        const rows = parseCSV(text);

        if (rows.length === 0) {
          showEmpty();
          return;
        }

        semuaData = rows;
        buildFilter(rows);
        renderGaleri(rows);

      } catch(e) {
        console.error(e);
        showEmpty();
      }
    }

    // ── PARSE CSV ───────────────────────────────────
    function parseCSV(text) {
      const lines = text.trim().split('\n').slice(1); // skip header
      return lines
        .map(line => {
          // Handle quoted fields with commas inside
          const cols = [];
          let cur = '', inQ = false;
          for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { inQ = !inQ; }
            else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else { cur += c; }
          }
          cols.push(cur.trim());

          return {
            judul:     cols[0] || '',
            konten:    cols[1] || '',
            thumbnail: cols[2] || '',
            tanggal:   cols[3] || '',
            kategori:  cols[4] || 'Umum',
            link:      cols[5] || '#',
          };
        })
        .filter(r => r.thumbnail); // hanya yang punya gambar
    }

    // ── BUILD FILTER ────────────────────────────────
    function buildFilter(data) {
      const wrap = document.getElementById('filter-wrap');
      const kategoriList = [...new Set(data.map(d => d.kategori).filter(Boolean))];

      kategoriList.forEach(kat => {
        const btn = document.createElement('button');
        btn.textContent = kat;
        btn.dataset.kat = kat;
        btn.className = 'filter-btn text-sm px-4 py-1.5 rounded-full border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition';
        btn.onclick = () => filterGaleri(kat);
        wrap.appendChild(btn);
      });
    }

    // ── RENDER GALERI ───────────────────────────────
    function renderGaleri(data) {
      const grid     = document.getElementById('galeri-grid');
      const skeleton = document.getElementById('galeri-skeleton');
      const counter  = document.getElementById('counter');

      skeleton.classList.add('hidden');

      if (data.length === 0) {
        showEmpty();
        return;
      }

      document.getElementById('galeri-empty').classList.add('hidden');
      grid.classList.remove('hidden');
      counter.textContent = `${data.length} foto`;

      grid.innerHTML = data.map((item, i) => `
        <div class="masonry-item gallery-card cursor-pointer relative rounded-xl overflow-hidden shadow-sm fade-in"
          style="animation-delay:${i * 0.05}s"
          onclick="openLightbox(${i}, ${JSON.stringify(data).replace(/"/g, '&quot;')})">

          <img src="${item.thumbnail}" alt="${item.judul}"
            class="w-full object-cover block"
            onerror="this.parentElement.style.display='none'">

          <!-- Overlay -->
          <div class="card-overlay absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex flex-col justify-end p-4">
            <p class="text-white font-semibold text-sm line-clamp-1">${item.judul}</p>
            <div class="flex items-center justify-between mt-1">
              <span class="text-xs text-gray-300">${item.kategori}</span>
              <svg class="w-4 h-4 text-white/70" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
              </svg>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ── FILTER ──────────────────────────────────────
    window.filterGaleri = (kat) => {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-white', 'border-primary');
        btn.classList.add('border-gray-300', 'text-gray-600');
      });
      const active = document.querySelector(`[data-kat="${kat || 'semua'}"]`);
      if (active) {
        active.classList.add('bg-primary', 'text-white', 'border-primary');
        active.classList.remove('border-gray-300', 'text-gray-600');
      }
      const filtered = kat ? semuaData.filter(d => d.kategori === kat) : semuaData;
      renderGaleri(filtered);
    };

    // ── LIGHTBOX ────────────────────────────────────
    window.openLightbox = (index, data) => {
      const item = data[index];
      document.getElementById('lb-img').src        = item.thumbnail;
      document.getElementById('lb-judul').textContent   = item.judul;
      document.getElementById('lb-konten').textContent  = item.konten;
      document.getElementById('lb-kategori').textContent = item.kategori;
      document.getElementById('lb-tanggal').textContent  = item.tanggal;
      document.getElementById('lb-link').href            = item.link || '#';
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = (e) => {
      if (e && e.target !== document.getElementById('lightbox')) return;
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = '';
    };

    // ESC untuk tutup lightbox
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').classList.add('hidden');
        document.body.style.overflow = '';
      }
    });

    // ── EMPTY ───────────────────────────────────────
    function showEmpty() {
      document.getElementById('galeri-skeleton').classList.add('hidden');
      document.getElementById('galeri-grid').classList.add('hidden');
      document.getElementById('galeri-empty').classList.remove('hidden');
    }

    loadGaleri();
  </script>

</body>
</html>
