<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Boibanet Admin</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { background: #1e40af; color: white; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .ql-container { font-family: 'Inter', sans-serif; font-size: 14px; min-height: 200px; }
    .ql-toolbar { border-radius: 8px 8px 0 0; border-color: #e5e7eb !important; }
    .ql-container { border-radius: 0 0 8px 8px; border-color: #e5e7eb !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-56 bg-secondary text-white flex flex-col fixed h-full z-30">
      <div class="px-5 py-5 border-b border-white/10">
        <div class="flex items-center gap-3">
          <img src="/assets/img/logo-Photoroom.png" alt="Boibanet" class="h-8 w-auto">
          <span class="text-sm font-semibold">Admin Panel</span>
        </div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/admin/blog.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/10 text-white text-sm font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z"/>
          </svg>
          Blog
        </a>
        <a href="/admin/materi.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 text-white/70 hover:text-white text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          Materi
        </a>
        <a href="/admin/portofolio.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 text-white/70 hover:text-white text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
          Portofolio
        </a>
        <a href="/admin/profil.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/10 text-white/70 hover:text-white text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profil
        </a>
      </nav>
      <div class="px-3 py-4 border-t border-white/10">
        <div class="flex items-center gap-3 px-3 mb-3">
          <img id="user-photo" class="w-7 h-7 rounded-full" src="" alt="">
          <span id="user-name" class="text-xs text-white/70 truncate"></span>
        </div>
        <button id="btn-logout"
          class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-white/10 text-white/70 hover:text-white text-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="ml-56 flex-1 p-8">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="text-xl font-bold text-gray-800">Kelola Blog</h1>
          <p class="text-sm text-gray-500 mt-0.5">Tambah, edit, dan hapus artikel blog</p>
        </div>
        <button onclick="openModal()"
          class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition">
          + Tambah Artikel
        </button>
      </div>

      <div id="list-blog" class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>
      </div>
    </main>

  </div>

  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-start justify-center px-4 py-8 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl">
      <div class="flex justify-between items-center px-6 py-4 border-b">
        <h3 id="modal-title" class="font-semibold text-gray-800"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <!-- Judul -->
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Judul</label>
          <input id="f-judul" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
        </div>
        <!-- Kategori & Status -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-medium text-gray-500 block mb-1">Kategori</label>
            <select id="f-kategori" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
              <option>Jaringan</option>
              <option>Teknologi</option>
              <option>AI</option>
              <option>Umum</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 block mb-1">Status</label>
            <select id="f-status" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
              <option>draft</option>
              <option>published</option>
            </select>
          </div>
        </div>
        <!-- Tanggal & Thumbnail -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-medium text-gray-500 block mb-1">Tanggal</label>
            <input id="f-tanggal" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
          </div>
          <div>
            <label class="text-xs font-medium text-gray-500 block mb-1">URL Thumbnail</label>
            <input id="f-thumbnail" type="text" placeholder="https://..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
          </div>
        </div>
        <!-- Konten Quill -->
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Konten</label>
          <div id="quill-editor"></div>
        </div>
      </div>
      <div class="px-6 py-4 border-t flex gap-3 justify-end">
        <button onclick="closeModal()"
          class="text-sm px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-gray-600">
          Batal
        </button>
        <button id="btn-save"
          class="text-sm px-5 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition font-medium">
          Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 text-white text-sm px-5 py-3 rounded-xl shadow-lg z-50"></div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, query, orderBy }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeE108oCH5F9hyGTLRmZu3bRW8ZxB3AbU",
      authDomain: "boibanet-f144c.firebaseapp.com",
      projectId: "boibanet-f144c",
      storageBucket: "boibanet-f144c.firebasestorage.app",
      messagingSenderId: "511701615381",
      appId: "1:511701615381:web:6c88c535ea817e941b5f1c"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // ─── AUTH ─────────────────────────────────────────
    onAuthStateChanged(auth, user => {
      if (!user) { window.location.href = '/admin/index.html'; return; }
      document.getElementById('user-name').textContent = user.displayName;
      document.getElementById('user-photo').src = user.photoURL;
      loadBlog();
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = '/admin/index.html');
    });

    // ─── QUILL ────────────────────────────────────────
    const quill = new Quill('#quill-editor', {
      theme: 'snow',
      placeholder: 'Tulis konten artikel...',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['blockquote', 'code-block'],
          ['link'],
          [{ align: [] }],
          ['clean']
        ]
      }
    });

    // ─── LOAD BLOG ────────────────────────────────────
    async function loadBlog() {
      const container = document.getElementById('list-blog');
      container.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>';
      try {
        const snap = await getDocs(query(collection(db, 'blog'), orderBy('tanggal', 'desc')));
        if (snap.empty) {
          container.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Belum ada artikel.</div>';
          return;
        }
        let rows = '';
        snap.forEach(d => {
          const data = d.data();
          rows += `<tr class="hover:bg-gray-50">
            <td class="px-4 py-3 font-medium text-gray-800 max-w-xs">
              <div class="line-clamp-1">${data.judul || '-'}</div>
            </td>
            <td class="px-4 py-3 text-gray-500 text-sm">${data.kategori || '-'}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-1 rounded text-xs ${data.status === 'published' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                ${data.status || '-'}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-500 text-sm">${data.tanggal || '-'}</td>
            <td class="px-4 py-3">
              <div class="flex gap-2">
                <button onclick="editDoc('${d.id}')"
                  class="text-xs text-primary border border-primary/30 px-3 py-1 rounded-lg hover:bg-blue-50 transition">Edit</button>
                <button onclick="deleteDoc('${d.id}')"
                  class="text-xs text-red-500 border border-red-200 px-3 py-1 rounded-lg hover:bg-red-50 transition">Hapus</button>
              </div>
            </td>
          </tr>`;
        });
        container.innerHTML = `
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="px-4 py-3 text-left">Judul</th>
                <th class="px-4 py-3 text-left">Kategori</th>
                <th class="px-4 py-3 text-left">Status</th>
                <th class="px-4 py-3 text-left">Tanggal</th>
                <th class="px-4 py-3 text-left">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">${rows}</tbody>
          </table>`;
      } catch (e) {
        container.innerHTML = `<div class="p-8 text-center text-red-400 text-sm">${e.message}</div>`;
      }
    }

    // ─── MODAL ────────────────────────────────────────
    let _editId = null;

    window.openModal = () => {
      _editId = null;
      document.getElementById('modal-title').textContent = 'Tambah Artikel';
      document.getElementById('f-judul').value = '';
      document.getElementById('f-kategori').value = 'Jaringan';
      document.getElementById('f-status').value = 'draft';
      document.getElementById('f-tanggal').value = '';
      document.getElementById('f-thumbnail').value = '';
      quill.setContents([]);
      document.getElementById('modal').classList.remove('hidden');
    };

    window.editDoc = async (id) => {
      _editId = id;
      const snap = await getDoc(doc(db, 'blog', id));
      const d = snap.data() || {};
      document.getElementById('modal-title').textContent = 'Edit Artikel';
      document.getElementById('f-judul').value      = d.judul      || '';
      document.getElementById('f-kategori').value   = d.kategori   || 'Jaringan';
      document.getElementById('f-status').value     = d.status     || 'draft';
      document.getElementById('f-tanggal').value    = d.tanggal    || '';
      document.getElementById('f-thumbnail').value  = d.thumbnail  || '';
      quill.root.innerHTML = d.konten || '';
      document.getElementById('modal').classList.remove('hidden');
    };

    window.closeModal = () => {
      document.getElementById('modal').classList.add('hidden');
    };

    document.getElementById('btn-save').addEventListener('click', async () => {
      const data = {
        judul:     document.getElementById('f-judul').value,
        kategori:  document.getElementById('f-kategori').value,
        status:    document.getElementById('f-status').value,
        tanggal:   document.getElementById('f-tanggal').value,
        thumbnail: document.getElementById('f-thumbnail').value,
        konten:    quill.root.innerHTML,
      };
      try {
        if (_editId) {
          await updateDoc(doc(db, 'blog', _editId), data);
          showToast('Artikel berhasil diupdate ✓');
        } else {
          await addDoc(collection(db, 'blog'), data);
          showToast('Artikel berhasil ditambahkan ✓');
        }
        closeModal();
        loadBlog();
      } catch (e) {
        showToast('Gagal: ' + e.message, true);
      }
    });

    window.deleteDoc = async (id) => {
      if (!confirm('Hapus artikel ini?')) return;
      try {
        await deleteDoc(doc(db, 'blog', id));
        showToast('Artikel berhasil dihapus ✓');
        loadBlog();
      } catch (e) {
        showToast('Gagal: ' + e.message, true);
      }
    };

    // ─── TOAST ────────────────────────────────────────
    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-5 right-5 text-white text-sm px-5 py-3 rounded-xl shadow-lg z-50 ${isError ? 'bg-red-500' : 'bg-gray-800'}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }
  </script>

</body>
</html>
