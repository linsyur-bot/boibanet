<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Boibanet</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-btn.active { background: #1e40af; color: white; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
      <div class="text-center mb-8">
        <img src="/assets/img/logo-Photoroom.png" alt="Boibanet" class="h-12 mx-auto mb-4">
        <h1 class="text-xl font-bold text-gray-800">Admin Panel</h1>
        <p class="text-sm text-gray-500 mt-1">Login dengan akun Google</p>
      </div>
      <button id="btn-login"
        class="w-full flex items-center justify-center gap-3 border border-gray-200 rounded-xl py-3 px-4 hover:bg-gray-50 transition text-sm font-medium text-gray-700">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login dengan Google
      </button>
      <p id="login-error" class="text-red-500 text-xs text-center mt-4 hidden"></p>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-panel" class="hidden min-h-screen">

    <!-- Topbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <img src="/assets/img/logo-Photoroom.png" alt="Boibanet" class="h-8 w-auto">
          <span class="text-sm font-semibold text-gray-700">Admin Panel</span>
        </div>
        <div class="flex items-center gap-3">
          <img id="user-photo" class="w-8 h-8 rounded-full" src="" alt="">
          <span id="user-name" class="text-sm text-gray-600 hidden md:block"></span>
          <button id="btn-logout"
            class="text-xs text-red-500 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-50 transition">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <div class="bg-white border-b">
      <div class="max-w-7xl mx-auto px-4 flex gap-2 py-2 overflow-x-auto">
        <button class="tab-btn active text-sm font-medium px-4 py-2 rounded-lg transition" data-tab="blog">Blog</button>
        <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg transition text-gray-600 hover:bg-gray-100" data-tab="materi">Materi</button>
        <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg transition text-gray-600 hover:bg-gray-100" data-tab="portofolio">Portofolio</button>
        <button class="tab-btn text-sm font-medium px-4 py-2 rounded-lg transition text-gray-600 hover:bg-gray-100" data-tab="profil">Profil</button>
      </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8">

      <!-- ===== TAB BLOG ===== -->
      <div id="tab-blog" class="tab-content">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800">Kelola Blog</h2>
          <button onclick="openModal('blog')"
            class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            + Tambah Artikel
          </button>
        </div>
        <div id="list-blog" class="bg-white rounded-xl shadow-sm overflow-hidden">
          <div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>
        </div>
      </div>

      <!-- ===== TAB MATERI ===== -->
      <div id="tab-materi" class="tab-content hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800">Kelola Materi</h2>
          <button onclick="openModal('materi')"
            class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            + Tambah Materi
          </button>
        </div>
        <div id="list-materi" class="bg-white rounded-xl shadow-sm overflow-hidden">
          <div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>
        </div>
      </div>

      <!-- ===== TAB PORTOFOLIO ===== -->
      <div id="tab-portofolio" class="tab-content hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800">Kelola Portofolio</h2>
          <button onclick="openModal('portofolio')"
            class="bg-primary text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            + Tambah Portofolio
          </button>
        </div>
        <div id="list-portofolio" class="bg-white rounded-xl shadow-sm overflow-hidden">
          <div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>
        </div>
      </div>

      <!-- ===== TAB PROFIL ===== -->
      <div id="tab-profil" class="tab-content hidden">
        <div class="mb-6">
          <h2 class="text-xl font-bold text-gray-800">Kelola Profil</h2>
        </div>
        <div id="form-profil" class="bg-white rounded-xl shadow-sm p-6 max-w-xl">
          <div class="p-4 text-center text-gray-400 text-sm">Memuat profil...</div>
        </div>
      </div>

    </main>
  </div>

  <!-- MODAL CRUD -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center px-6 py-4 border-b">
        <h3 id="modal-title" class="font-semibold text-gray-800"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="px-6 py-5 space-y-4"></div>
      <div class="px-6 py-4 border-t flex gap-3 justify-end">
        <button onclick="closeModal()"
          class="text-sm px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-gray-600">
          Batal
        </button>
        <button id="modal-save"
          class="text-sm px-5 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition font-medium">
          Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-5 right-5 bg-gray-800 text-white text-sm px-5 py-3 rounded-xl shadow-lg z-50 transition-all"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc, orderBy, query }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeE108oCH5F9hyGTLRmZu3bRW8ZxB3AbU",
      authDomain: "boibanet-f144c.firebaseapp.com",
      projectId: "boibanet-f144c",
      storageBucket: "boibanet-f144c.firebasestorage.app",
      messagingSenderId: "511701615381",
      appId: "1:511701615381:web:6c88c535ea817e941b5f1c"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // ─── AUTH ───────────────────────────────────────────
    document.getElementById('btn-login').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        const err = document.getElementById('login-error');
        err.textContent = 'Login gagal: ' + e.message;
        err.classList.remove('hidden');
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        document.getElementById('user-name').textContent = user.displayName;
        document.getElementById('user-photo').src = user.photoURL;
        loadTab('blog');
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
      }
    });

    // ─── TABS ────────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active');
          b.classList.add('text-gray-600');
        });
        btn.classList.add('active');
        btn.classList.remove('text-gray-600');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
        loadTab(btn.dataset.tab);
      });
    });

    // ─── LOAD TAB ────────────────────────────────────────
    async function loadTab(tab) {
      if (tab === 'profil') { loadProfil(); return; }
      const container = document.getElementById('list-' + tab);
      container.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Memuat data...</div>';
      try {
        const snap = await getDocs(query(collection(db, tab)));
        if (snap.empty) {
          container.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">Belum ada data.</div>';
          return;
        }
        let rows = '';
        snap.forEach(d => { rows += renderRow(tab, d.id, d.data()); });
        container.innerHTML = `<table class="w-full text-sm">
          <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
            <tr>${getHeaders(tab)}</tr>
          </thead>
          <tbody class="divide-y divide-gray-100">${rows}</tbody>
        </table>`;
      } catch (e) {
        container.innerHTML = `<div class="p-8 text-center text-red-400 text-sm">${e.message}</div>`;
      }
    }

    function getHeaders(tab) {
      const h = {
        blog: ['Judul', 'Kategori', 'Status', 'Tanggal', 'Aksi'],
        materi: ['Judul', 'Jenjang', 'Semester', 'Status', 'Aksi'],
        portofolio: ['Judul', 'Jenis', 'Tahun', 'Aksi'],
      };
      return (h[tab] || []).map(x => `<th class="px-4 py-3 text-left">${x}</th>`).join('');
    }

    function renderRow(tab, id, d) {
      const aksi = `
        <td class="px-4 py-3">
          <div class="flex gap-2">
            <button onclick="editDoc('${tab}','${id}')"
              class="text-xs text-primary border border-primary/30 px-3 py-1 rounded-lg hover:bg-blue-50 transition">Edit</button>
            <button onclick="deleteDocument('${tab}','${id}')"
              class="text-xs text-red-500 border border-red-200 px-3 py-1 rounded-lg hover:bg-red-50 transition">Hapus</button>
          </div>
        </td>`;
      if (tab === 'blog') return `<tr class="hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-800 max-w-xs"><div class="line-clamp-1">${d.judul||'-'}</div></td>
        <td class="px-4 py-3 text-gray-500">${d.kategori||'-'}</td>
        <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs ${d.status==='published'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}">${d.status||'-'}</span></td>
        <td class="px-4 py-3 text-gray-500">${d.tanggal||'-'}</td>${aksi}</tr>`;
      if (tab === 'materi') return `<tr class="hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-800 max-w-xs"><div class="line-clamp-1">${d.judul||'-'}</div></td>
        <td class="px-4 py-3 text-gray-500">${d.jenjang||'-'}</td>
        <td class="px-4 py-3 text-gray-500">${d.semester||'-'}</td>
        <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs ${d.status==='published'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}">${d.status||'-'}</span></td>${aksi}</tr>`;
      if (tab === 'portofolio') return `<tr class="hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-800 max-w-xs"><div class="line-clamp-1">${d.judul||'-'}</div></td>
        <td class="px-4 py-3 text-gray-500">${d.jenis||'-'}</td>
        <td class="px-4 py-3 text-gray-500">${d.tahun||'-'}</td>${aksi}</tr>`;
      return '';
    }

    // ─── PROFIL ──────────────────────────────────────────
    async function loadProfil() {
      const container = document.getElementById('form-profil');
      try {
        const snap = await getDocs(collection(db, 'profil'));
        let data = {}, docId = null;
        snap.forEach(d => { data = d.data(); docId = d.id; });
        container.innerHTML = `
          <div class="space-y-4">
            <div><label class="text-xs font-medium text-gray-500 block mb-1">Nama</label>
              <input id="p-nama" value="${data.nama||''}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary"></div>
            <div><label class="text-xs font-medium text-gray-500 block mb-1">Email</label>
              <input id="p-email" value="${data.email||''}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary"></div>
            <div><label class="text-xs font-medium text-gray-500 block mb-1">Institusi</label>
              <input id="p-institusi" value="${data.institusi||''}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary"></div>
            <div><label class="text-xs font-medium text-gray-500 block mb-1">URL Foto</label>
              <input id="p-foto" value="${data.foto_url||''}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary"></div>
            <button onclick="saveProfil('${docId}')"
              class="bg-primary text-white text-sm font-medium px-5 py-2 rounded-lg hover:bg-blue-700 transition">
              Simpan Profil
            </button>
          </div>`;
      } catch (e) {
        container.innerHTML = `<div class="text-red-400 text-sm">${e.message}</div>`;
      }
    }

    window.saveProfil = async (docId) => {
      const data = {
        nama: document.getElementById('p-nama').value,
        email: document.getElementById('p-email').value,
        institusi: document.getElementById('p-institusi').value,
        foto_url: document.getElementById('p-foto').value,
      };
      try {
        if (docId && docId !== 'null') {
          await updateDoc(doc(db, 'profil', docId), data);
        } else {
          await addDoc(collection(db, 'profil'), data);
        }
        showToast('Profil berhasil disimpan ✓');
      } catch (e) { showToast('Gagal: ' + e.message, true); }
    };

    // ─── MODAL ───────────────────────────────────────────
    let _modalTab = '', _modalId = null;

    const fields = {
      blog: [
        { id: 'judul', label: 'Judul', type: 'text' },
        { id: 'kategori', label: 'Kategori', type: 'select', options: ['Jaringan','Teknologi','AI','Umum'] },
        { id: 'tanggal', label: 'Tanggal', type: 'date' },
        { id: 'thumbnail', label: 'URL Thumbnail', type: 'text' },
        { id: 'konten', label: 'Konten', type: 'textarea' },
        { id: 'status', label: 'Status', type: 'select', options: ['draft','published'] },
      ],
      materi: [
        { id: 'judul', label: 'Judul', type: 'text' },
        { id: 'jenjang', label: 'Jenjang', type: 'select', options: ['D3','S1'] },
        { id: 'semester', label: 'Semester', type: 'text' },
        { id: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
        { id: 'file_url', label: 'URL File', type: 'text' },
        { id: 'status', label: 'Status', type: 'select', options: ['coming soon','published'] },
      ],
      portofolio: [
        { id: 'judul', label: 'Judul', type: 'text' },
        { id: 'jenis', label: 'Jenis', type: 'select', options: ['Jurnal','Penelitian','Proyek','Lainnya'] },
        { id: 'tahun', label: 'Tahun', type: 'text' },
        { id: 'deskripsi', label: 'Deskripsi', type: 'textarea' },
        { id: 'file_url', label: 'URL File / Link', type: 'text' },
      ],
    };

    window.openModal = (tab, data = {}) => {
      _modalTab = tab; _modalId = null;
      document.getElementById('modal-title').textContent = 'Tambah ' + tab.charAt(0).toUpperCase() + tab.slice(1);
      renderModalForm(tab, data);
      document.getElementById('modal').classList.remove('hidden');
    };

    window.editDoc = async (tab, id) => {
      _modalTab = tab; _modalId = id;
      const snap = await getDoc(doc(db, tab, id));
      const data = snap.data() || {};
      document.getElementById('modal-title').textContent = 'Edit ' + tab.charAt(0).toUpperCase() + tab.slice(1);
      renderModalForm(tab, data);
      document.getElementById('modal').classList.remove('hidden');
    };

    function renderModalForm(tab, data) {
      const f = fields[tab] || [];
      document.getElementById('modal-body').innerHTML = f.map(field => {
        const val = data[field.id] || '';
        if (field.type === 'textarea') return `
          <div><label class="text-xs font-medium text-gray-500 block mb-1">${field.label}</label>
          <textarea id="f-${field.id}" rows="4"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary resize-none">${val}</textarea></div>`;
        if (field.type === 'select') return `
          <div><label class="text-xs font-medium text-gray-500 block mb-1">${field.label}</label>
          <select id="f-${field.id}" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
            ${field.options.map(o => `<option ${o===val?'selected':''}>${o}</option>`).join('')}
          </select></div>`;
        return `
          <div><label class="text-xs font-medium text-gray-500 block mb-1">${field.label}</label>
          <input id="f-${field.id}" type="${field.type}" value="${val}"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary"></div>`;
      }).join('');
    }

    window.closeModal = () => document.getElementById('modal').classList.add('hidden');

    document.getElementById('modal-save').addEventListener('click', async () => {
      const f = fields[_modalTab] || [];
      const data = {};
      f.forEach(field => {
        const el = document.getElementById('f-' + field.id);
        data[field.id] = el ? el.value : '';
      });
      try {
        if (_modalId) {
          await updateDoc(doc(db, _modalTab, _modalId), data);
          showToast('Data berhasil diupdate ✓');
        } else {
          await addDoc(collection(db, _modalTab), data);
          showToast('Data berhasil ditambahkan ✓');
        }
        closeModal();
        loadTab(_modalTab);
      } catch (e) { showToast('Gagal: ' + e.message, true); }
    });

    window.deleteDocument = async (tab, id) => {
      if (!confirm('Hapus data ini?')) return;
      try {
        await deleteDoc(doc(db, tab, id));
        showToast('Data berhasil dihapus ✓');
        loadTab(tab);
      } catch (e) { showToast('Gagal: ' + e.message, true); }
    };

    // ─── TOAST ───────────────────────────────────────────
    window.showToast = (msg, isError = false) => {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-5 right-5 text-white text-sm px-5 py-3 rounded-xl shadow-lg z-50 ${isError ? 'bg-red-500' : 'bg-gray-800'}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    };
  </script>
</body>
</html>
