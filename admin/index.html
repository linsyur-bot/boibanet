<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Boibanet Admin</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease forwards; }
    .fade-up-2 { animation: fadeUp 0.6s ease forwards 0.15s; opacity: 0; }
    .fade-up-3 { animation: fadeUp 0.6s ease forwards 0.3s; opacity: 0; }
    .bg-grid {
      background-color: #0f172a;
      background-image:
        linear-gradient(rgba(30,64,175,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,64,175,0.15) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="bg-grid min-h-screen flex items-center justify-center px-4">

  <!-- Glow effect -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative w-full max-w-md">

    <!-- Card -->
    <div class="fade-up bg-white/5 backdrop-blur-sm border border-white/10 rounded-3xl p-8 shadow-2xl">

      <!-- Logo & Title -->
      <div class="text-center mb-8">
        <div class="fade-up inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-2xl mb-4 border border-white/20">
          <img src="/assets/img/logo-Photoroom.png" alt="Boibanet" class="h-10 w-auto">
        </div>
        <h1 class="fade-up-2 text-2xl font-bold text-white">Boibanet Admin</h1>
        <p class="fade-up-2 text-sm text-blue-200/70 mt-1">Masuk untuk mengelola konten</p>
      </div>

      <!-- Divider -->
      <div class="fade-up-2 flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-white/30">Autentikasi Google</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Login Button -->
      <button id="btn-login"
        class="fade-up-3 w-full flex items-center justify-center gap-3 bg-white text-gray-700 font-medium px-5 py-3 rounded-xl hover:bg-gray-50 active:scale-95 transition-all text-sm shadow-lg">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login dengan Google
      </button>

      <!-- Error -->
      <p id="login-error" class="hidden text-red-400 text-xs text-center mt-4"></p>

      <!-- Footer -->
      <p class="fade-up-3 text-center text-white/20 text-xs mt-8">
        © 2025 Boibanet · Hanya untuk admin
      </p>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeE108oCH5F9hyGTLRmZu3bRW8ZxB3AbU",
      authDomain: "boibanet-f144c.firebaseapp.com",
      projectId: "boibanet-f144c",
      storageBucket: "boibanet-f144c.firebasestorage.app",
      messagingSenderId: "511701615381",
      appId: "1:511701615381:web:6c88c535ea817e941b5f1c"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // Kalau sudah login, langsung redirect ke blog
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = '/admin/blog.html';
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('login-error');
      btn.textContent = 'Memproses...';
      btn.disabled = true;
      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged akan handle redirect
      } catch (e) {
        err.textContent = 'Login gagal: ' + e.message;
        err.classList.remove('hidden');
        btn.innerHTML = `<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg> Login dengan Google`;
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
