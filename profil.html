<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil — Boibanet</title>
  <link rel="icon" type="image/png" href="/assets/img/logo-Photoroom.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#1e40af', secondary: '#1e3a5f' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/js/include.js"></script>
</head>
<body class="bg-gray-50 font-sans">

  <div include="/assets/components/header.html"></div>

  <main class="max-w-2xl mx-auto px-4 py-12">

    <!-- Skeleton -->
    <div id="skeleton" class="bg-white rounded-2xl shadow-sm p-8 animate-pulse">
      <div class="flex items-center gap-6">
        <div class="w-20 h-20 rounded-full bg-gray-200"></div>
        <div class="flex-1 space-y-3">
          <div class="h-5 bg-gray-200 rounded w-1/2"></div>
          <div class="h-4 bg-gray-200 rounded w-1/3"></div>
          <div class="h-4 bg-gray-200 rounded w-2/3"></div>
        </div>
      </div>
    </div>

    <!-- Profil card -->
    <div id="profil-card" class="hidden bg-white rounded-2xl shadow-sm p-8">
      <div class="flex items-center gap-6">
        <img id="p-foto" src="" alt="Foto Profil"
          class="w-20 h-20 rounded-full object-cover border border-gray-100 shadow-sm">
        <div>
          <h1 id="p-nama" class="text-xl font-bold text-gray-800"></h1>
          <p id="p-institusi" class="text-sm text-gray-500 mt-1"></p>
          <a id="p-email" href="#" class="text-sm text-blue-600 hover:underline mt-1 block"></a>
        </div>
      </div>
    </div>

    <!-- Error -->
    <div id="profil-error" class="hidden text-center text-red-400 text-sm py-8"></div>

  </main>

  <div include="/assets/components/footer.html"></div>

  <script type="module">
    import { initProfil } from '/assets/js/controllers/ProfilController.js';
    initProfil();
  </script>

</body>
</html>
